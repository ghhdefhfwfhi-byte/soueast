<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOUEAST × Watad — Dammam Showroom Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Michroma&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--black:#000;--ink:#111;--ink2:#3a3a3a;--ink3:#5c5c5c;--page:#F0F2F5;--card:#fff;--line:#E4E6EA;--line2:#D0D3D8;--orange:#FF6B1A;--amber:#FFA726;--tint:#FFF1E6;--red:#D93036}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal','Helvetica Neue',Arial,sans-serif;background:var(--page);color:var(--ink);min-height:100vh}
button,input,select,textarea{font-family:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lat{font-family:'Helvetica Neue',Arial,sans-serif}

/* header */
.top{position:sticky;top:0;z-index:50;background:#000;padding:12px 28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:14px}
.wordmark{font-family:'Michroma',sans-serif;font-size:17px;letter-spacing:6px;color:var(--orange)}
.sep{width:1px;height:22px;background:#333}
.ttl{font-size:14px;color:#fff;font-weight:500}
.sync{font-size:12px;color:#aaa}
.actions{display:flex;gap:8px;align-items:center}
.btn{font-size:13px;font-weight:500;padding:8px 14px;border-radius:6px;border:1px solid var(--line2);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.btn:hover{border-color:var(--amber)}
.btn.dark{background:transparent;color:#fff;border-color:#444}
.btn.dark:hover{border-color:var(--amber);color:var(--amber)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#000;font-weight:700}
.btn.pri:hover{background:var(--orange);border-color:var(--orange)}
.btn.blk{background:#000;border-color:#000;color:var(--amber);font-weight:700}
.btn.danger:hover{border-color:var(--red);color:var(--red)}

/* layout */
.wrap{max-width:1440px;margin:0 auto;padding:22px 28px;display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.side{flex:1 1 300px;max-width:350px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;position:sticky;top:76px;max-height:calc(100vh - 96px);display:flex;flex-direction:column}
.side-h{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.side-h strong{font-size:15px}
.side-h span{font-size:12px;color:var(--ink3)}
.side-body{overflow-y:auto}
.ph-h{width:100%;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:#FAFAFB;border:none;border-top:1px solid var(--line);cursor:pointer;text-align:right}
.ph-h .nm{font-size:14px;font-weight:800;color:var(--ink)}
.ph-h .ct{font-size:12px;color:var(--ink3);display:flex;gap:6px;align-items:center}
.chev{transition:transform .2s}
.ph.closed .chev{transform:rotate(90deg)}
.ph.closed .ph-items{display:none}
.it{width:100%;padding:10px 16px;display:flex;gap:10px;align-items:center;border:none;border-top:1px solid #F0F2F5;background:#fff;cursor:pointer;text-align:right;border-right:3px solid transparent}
.it:hover{background:#FAFAFB}
.it.on{background:var(--tint);border-right-color:var(--orange)}
.it .n{font-size:12px;color:var(--ink3);width:20px;flex-shrink:0}
.it .th{width:34px;height:52px;border-radius:4px;background:#1a1a1a;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.it .tx{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.it .t1{font-size:13px;font-weight:700;line-height:1.35;color:var(--ink);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.it .t2{font-size:11px;color:var(--ink3)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.st-new{background:#C4C8CE}.st-shoot{background:var(--amber)}.st-done{background:#1F8A3E}
.add-in{width:100%;padding:10px 16px;border:none;border-top:1px dashed var(--line2);background:#fff;color:var(--ink3);font-size:13px;cursor:pointer;text-align:right}
.add-in:hover{color:#000;background:#FAFAFB}

.main{flex:999 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px}
.phase-strip{background:#000;color:#fff;border-radius:8px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center;border-bottom:3px solid var(--orange)}
.phase-strip h2{font-size:19px;font-weight:800}
.phase-strip p{font-size:13px;color:#bbb;margin-top:3px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:4px 10px;border-radius:4px;border:1px solid #333;color:#ddd}
.pill.o{border-color:rgba(255,167,38,.5);color:var(--amber)}
.split{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#ccc}
.split b{color:#fff}

.stage{background:#fff;border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-wrap:wrap;gap:24px}
.player-col{flex:0 0 340px;max-width:100%;display:flex;flex-direction:column;gap:10px}
.player{width:340px;max-width:100%;aspect-ratio:9/16;background:#111;border-radius:10px;overflow:hidden;position:relative}
.player iframe{width:100%;height:100%;border:0;display:block;background:#111}
.player .empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#bbb;font-size:13px;text-align:center;padding:20px}
.refs{display:flex;gap:6px;flex-wrap:wrap}
.ref-tab{flex:1 1 90px;font-size:12px;padding:8px 6px;border-radius:6px;border:1px solid var(--line2);background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.ref-tab b{font-size:12px}
.ref-tab span{font-size:11px;color:var(--ink3)}
.ref-tab.on{background:#000;border-color:#000;color:var(--amber)}
.ref-tab.on span{color:#ccc}
.ref-links{display:flex;justify-content:space-between;gap:8px;font-size:12px}
.ref-links a{color:#B4410C}

.info{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:14px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.bdg{font-size:12px;font-weight:700;padding:4px 10px;border-radius:4px}
.b-ph{background:#000;color:var(--amber)}
.b-meta{background:#E8F0FE;color:#1a56c4}.b-snap{background:#FFFC00;color:#000}.b-tt{background:#111;color:#fff}.b-all{background:var(--tint);color:#9A3412}
.b-fmt{background:#EEF0F3;color:#333;font-weight:500}
.e-title{font-size:24px;font-weight:800;line-height:1.35;border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:-4px -6px;background:transparent;width:calc(100% + 12px);color:var(--ink)}
.e-desc{font-size:15px;line-height:1.8;color:var(--ink2);border:1px solid transparent;border-radius:6px;padding:4px 6px;margin:-4px -6px;background:transparent;width:calc(100% + 12px);resize:vertical;min-height:70px}
.e-title:hover,.e-desc:hover{border-color:var(--line)}
.e-title:focus,.e-desc:focus{outline:none;border-color:var(--amber);background:#fff}
.box{background:#FAFAFB;border:1px solid var(--line);border-radius:6px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.box label{font-size:12px;font-weight:700;color:var(--ink3)}
.box textarea,.box input{border:1px solid var(--line);border-radius:4px;background:#fff;padding:8px 10px;font-size:14px;line-height:1.7;color:var(--ink);width:100%}
.box textarea{min-height:64px;resize:vertical}
.box textarea:focus,.box input:focus,select:focus{outline:none;border-color:var(--amber)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row label{font-size:13px;color:var(--ink3)}
select{font-size:13px;padding:8px 12px;border:1px solid var(--line2);border-radius:6px;background:#fff}
.add-ref{display:flex;gap:8px;flex-wrap:wrap}
.add-ref input{flex:1 1 220px}
.nav{margin-top:auto;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:6px}
.nav .btn{padding:12px 18px;font-size:14px}
.counter{font-size:13px;color:var(--ink3);align-self:center}

/* modal */
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:center;justify-content:center;padding:16px}
.ov.open{display:flex}
.modal{background:#fff;border-radius:8px;border-top:4px solid var(--orange);width:480px;max-width:100%;padding:22px;max-height:90vh;overflow-y:auto}
.modal h3{font-size:17px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.fg{margin-bottom:12px;display:flex;flex-direction:column;gap:6px}
.fg label{font-size:12px;font-weight:700;color:var(--ink3)}
.fg input,.fg select,.fg textarea{width:100%;font-size:14px;padding:9px 12px;border:1px solid var(--line2);border-radius:6px}
.fg textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.m-act{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(120px);background:#000;color:var(--amber);font-weight:700;font-size:13px;padding:10px 20px;border-radius:6px;z-index:200;transition:transform .3s}
.toast.show{transform:translateX(-50%) translateY(0)}
footer{background:#000;margin-top:30px;padding:16px 28px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center}
footer span{font-size:11px;color:#9a9a9a}

@media (max-width:760px){
  .top{padding:10px 14px}.ttl,.sep{display:none}
  .wrap{padding:14px}
  .side{position:static;max-width:none;max-height:none}
  .side-body{max-height:300px}
  .player-col{flex:1 1 100%;align-items:center}
  .player{width:100%;max-width:360px}
  .two{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">
    <span class="wordmark">SOUEAST</span><span class="sep"></span>
    <span class="ttl">Dammam Showroom — Content Plan</span>
  </div>
  <span class="sync lat" id="sync">connecting…</span>
  <div class="actions">
    <button class="btn dark" onclick="openAdd()">+ فكرة جديدة</button>
    <button class="btn pri" onclick="saveAll(true)">حفظ</button>
  </div>
</header>

<div class="wrap">
  <aside class="side" aria-label="قائمة المحتوى">
    <div class="side-h"><strong>قائمة المحتوى</strong><span id="side-count"></span></div>
    <div class="side-body" id="side"></div>
  </aside>
  <main class="main" id="main"></main>
</div>

<div class="ov" id="ov-add" role="dialog" aria-modal="true" aria-labelledby="add-h">
  <div class="modal">
    <h3 id="add-h">فكرة جديدة <button class="btn" onclick="closeAdd()" aria-label="إغلاق">✕</button></h3>
    <div class="two">
      <div class="fg"><label for="a-ph">المرحلة</label><select id="a-ph"></select></div>
      <div class="fg"><label for="a-pl">المنصة</label><select id="a-pl"><option>Snapchat</option><option>Meta</option><option>TikTok</option><option>All Platforms</option></select></div>
    </div>
    <div class="fg"><label for="a-t">عنوان الفكرة</label><input id="a-t" placeholder="مثال: Reels 15s — تعريف بالبراند"></div>
    <div class="fg"><label for="a-d">الوصف</label><textarea id="a-d" placeholder="شنو الفكرة وشلون تتصور"></textarea></div>
    <div class="fg"><label for="a-tag">المنصة / المقاس</label><input id="a-tag" placeholder="Snapchat — 9:16 · 10s"></div>
    <div class="fg"><label for="a-u">لينك رفرنس (إنستغرام / تيك توك)</label><input id="a-u" class="lat" dir="ltr" placeholder="https://www.instagram.com/reel/..."></div>
    <div class="m-act"><button class="btn" onclick="closeAdd()">إلغاء</button><button class="btn pri" onclick="addIdea()">+ إضافة</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer><span>Prepared by Watad Agency for SOUEAST Saudi Arabia · 2026 · Confidential</span><span class="wordmark" style="font-size:13px">SOUEAST</span></footer>

// ─── STATE ─────────────────────────────────────────────────────────────
let cur = { ph:'1', id:null, ref:0 };
const closed = new Set();

// ─── HELPERS ───────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function embedUrl(u){
  let m = u.match(/instagram\.com\/(?:[^\/]+\/)?(?:reel|reels|p|tv)\/([A-Za-z0-9_-]+)/);
  if (m) return 'https://www.instagram.com/reel/'+m[1]+'/embed/';
  m = u.match(/tiktok\.com\/.*\/video\/(\d+)/);
  if (m) return 'https://www.tiktok.com/player/v1/'+m[1]+'?music_info=1&description=1&rel=0';
  m = u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
  if (m) return 'https://www.youtube.com/embed/'+m[1];
  return null;
}
function handleOf(u){
  let m = u.match(/tiktok\.com\/@([^\/?]+)/); if (m) return '@'+m[1];
  m = u.match(/instagram\.com\/([^\/?]+)\/(?:reel|p)\//); if (m) return '@'+m[1];
  if (/instagram\.com/.test(u)) return 'Instagram';
  try { return new URL(u).hostname.replace('www.',''); } catch(e){ return 'لينك'; }
}
const srcLabel = u => /tiktok/.test(u) ? 'TikTok' : /instagram/.test(u) ? 'Instagram' : /youtu/.test(u) ? 'YouTube' : 'Link';
const plClass = p => ({Meta:'b-meta',Snapchat:'b-snap',TikTok:'b-tt'})[p] || 'b-all';
const ST = { new:'جديد', shoot:'قيد التصوير', done:'جاهز' };
const items = ph => data[ph] || (data[ph] = []);
const curItem = () => items(cur.ph).find(x => x.id === cur.id);
function flat(){ const out=[]; PHASES.forEach(p => items(p.id).forEach((it,i) => out.push({ph:p.id, it, i}))); return out; }
function norm(m){ return typeof m === 'string' ? {url:m, note:''} : m; }

// ─── RENDER: SIDEBAR ───────────────────────────────────────────────────
function renderSide(){
  const total = flat().length;
  document.getElementById('side-count').textContent = total + ' فكرة · ' + PHASES.length + ' مراحل';
  let n = 0, html = '';
  PHASES.forEach(p => {
    const list = items(p.id);
    html += `<div class="ph ${closed.has(p.id)?'closed':''}">
      <button class="ph-h" onclick="togglePh('${p.id}')" aria-expanded="${!closed.has(p.id)}">
        <span class="nm">${esc(p.name)}</span>
        <span class="ct">${list.length}<svg class="chev" aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M3 4.5l3 3 3-3" stroke="#5c5c5c" stroke-width="1.6" fill="none"/></svg></span>
      </button><div class="ph-items">`;
    list.forEach(it => {
      n++;
      const refs = (it.media||[]).length;
      html += `<button class="it ${it.id===cur.id?'on':''}" onclick="select('${p.id}','${it.id}')">
        <span class="n lat">${String(n).padStart(2,'0')}</span>
        <span class="th" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 1.5v9l7.5-4.5z" fill="#FFA726"/></svg></span>
        <span class="tx"><span class="t1">${esc(it.type)}</span><span class="t2">${esc(it.platform)} · ${refs} رفرنس</span></span>
        <span class="dot st-${it.status||'new'}" title="${ST[it.status||'new']}"></span>
      </button>`;
    });
    html += `<button class="add-in" onclick="openAdd('${p.id}')">+ إضافة فكرة لهذه المرحلة</button></div></div>`;
  });
  document.getElementById('side').innerHTML = html;
}

// ─── RENDER: MAIN ──────────────────────────────────────────────────────
function renderMain(){
  const p = PHASES.find(x => x.id === cur.ph);
  const it = curItem();
  const all = flat(); const pos = all.findIndex(x => x.it.id === cur.id);
  let html = `<section class="phase-strip">
    <div><h2>${esc(p.full)}</h2><p>${esc(p.sub)}</p></div>
    <div class="pills"><span class="pill">${esc(p.period)}</span><span class="pill o">${esc(p.obj)}</span></div>
    <div class="split lat">${esc(p.split)}</div>
  </section>`;
  if (!it){
    html += `<section class="stage"><p style="font-size:15px;color:#5c5c5c">ما بيها أفكار بعد. <button class="btn pri" onclick="openAdd('${cur.ph}')">+ أضف أول فكرة</button></p></section>`;
    document.getElementById('main').innerHTML = html; return;
  }
  const media = (it.media||[]).map(norm);
  if (cur.ref >= media.length) cur.ref = 0;
  const r = media[cur.ref];
  const emb = r ? embedUrl(r.url) : null;
  const player = r
    ? (emb ? `<iframe src="${esc(emb)}" title="${esc(handleOf(r.url))}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen loading="lazy" scrolling="no"></iframe>`
           : `<div class="empty">هذا اللينك ما يتشغل داخل الصفحة<a class="btn pri" href="${esc(r.url)}" target="_blank" rel="noopener">افتحه ↗</a></div>`)
    : `<div class="empty">ما بيها رفرنس بعد — أضف لينك إنستغرام أو تيك توك تحت</div>`;
  const tabs = media.map((m,i) => `<button class="ref-tab ${i===cur.ref?'on':''}" onclick="pickRef(${i})"><b class="lat">${esc(handleOf(m.url))}</b><span class="lat">${esc(srcLabel(m.url))}${m.views?' · '+esc(m.views):''}</span></button>`).join('');
  html += `<section class="stage">
    <div class="player-col">
      <div class="player">${player}</div>
      ${media.length ? `<div class="refs">${tabs}</div>` : ''}
      ${r ? `<div class="ref-links"><a href="${esc(r.url)}" target="_blank" rel="noopener">افتح بالتطبيق ↗</a><button class="btn danger" style="padding:4px 10px;font-size:12px" onclick="delRef()">حذف الرفرنس</button></div>` : ''}
    </div>
    <div class="info">
      <div class="badges">
        <span class="bdg b-ph">${esc(p.name)}</span>
        <span class="bdg ${plClass(it.platform)}">${esc(it.platform)}</span>
        <span class="bdg b-fmt">${esc(it.tag||'')}</span>
      </div>
      <label class="sr" for="f-title">عنوان الفكرة</label>
      <input id="f-title" class="e-title" value="${esc(it.type)}" oninput="upd('type',this.value)">
      <label class="sr" for="f-desc">الوصف</label>
      <textarea id="f-desc" class="e-desc" oninput="upd('desc',this.value)">${esc(it.desc)}</textarea>
      ${r ? `<div class="box"><label for="f-note">شنو ناخذ من الرفرنس (${esc(handleOf(r.url))})</label><textarea id="f-note" oninput="updNote(this.value)">${esc(r.note||'')}</textarea></div>` : ''}
      <div class="box"><label for="f-url">إضافة رفرنس جديد</label>
        <div class="add-ref"><input id="f-url" class="lat" dir="ltr" placeholder="https://www.instagram.com/reel/... أو tiktok.com/@.../video/..."><button class="btn blk" onclick="addRef()">+ إضافة</button></div>
      </div>
      <div class="row">
        <label for="f-st">الحالة</label>
        <select id="f-st" onchange="upd('status',this.value);renderSide()">${Object.entries(ST).map(([k,v]) => `<option value="${k}" ${it.status===k?'selected':''}>${v}</option>`).join('')}</select>
        <label for="f-tag">المنصة / المقاس</label>
        <input id="f-tag" value="${esc(it.tag||'')}" oninput="upd('tag',this.value)" style="font-size:13px;padding:8px 10px;border:1px solid #D0D3D8;border-radius:6px;flex:1 1 160px">
        <button class="btn danger" onclick="delIdea()">حذف الفكرة</button>
      </div>
      <div class="nav">
        <button class="btn pri" onclick="step(1)" ${pos>=all.length-1?'disabled style="opacity:.4"':''}>الفكرة التالية ←</button>
        <span class="counter lat">${pos+1} / ${all.length}</span>
        <button class="btn" onclick="step(-1)" ${pos<=0?'disabled style="opacity:.4"':''}>→ السابقة</button>
      </div>
    </div>
  </section>`;
  document.getElementById('main').innerHTML = html;
}
function renderAll(){ renderSide(); renderMain(); }

// ─── ACTIONS ───────────────────────────────────────────────────────────
function select(ph,id){ cur = {ph, id, ref:0}; location.hash = ph+'-'+id; renderAll(); if (innerWidth < 760) document.getElementById('main').scrollIntoView({behavior:'smooth'}); }
function togglePh(id){ closed.has(id) ? closed.delete(id) : closed.add(id); renderSide(); }
function pickRef(i){ cur.ref = i; renderMain(); }
function step(d){ const all = flat(); const pos = all.findIndex(x => x.it.id === cur.id); const nx = all[pos+d]; if (nx) select(nx.ph, nx.it.id); }
function upd(f,v){ const it = curItem(); if (!it) return; it[f] = v; if (f==='type'){ renderSide(); } queueSave(); }
function updNote(v){ const it = curItem(); if (!it) return; it.media = it.media.map(norm); it.media[cur.ref].note = v; queueSave(); }
function addRef(){
  const el = document.getElementById('f-url'); const u = el.value.trim(); if (!u) return;
  const it = curItem(); it.media = (it.media||[]).map(norm); it.media.push({url:u, note:'', views:''});
  cur.ref = it.media.length-1; renderAll(); toast('تمت إضافة الرفرنس'); saveAll();
}
function delRef(){ const it = curItem(); if (!it || !confirm('تحذف هذا الرفرنس؟')) return; it.media.splice(cur.ref,1); cur.ref = 0; renderAll(); saveAll(); }
function delIdea(){
  if (!confirm('تحذف هذه الفكرة؟')) return;
  const all = flat(); const pos = all.findIndex(x => x.it.id === cur.id);
  data[cur.ph] = items(cur.ph).filter(x => x.id !== cur.id);
  const nx = flat()[Math.min(pos, flat().length-1)];
  cur = nx ? {ph:nx.ph, id:nx.it.id, ref:0} : {ph:cur.ph, id:null, ref:0};
  renderAll(); toast('تم الحذف'); saveAll();
}

// add modal
function openAdd(ph){
  const s = document.getElementById('a-ph');
  s.innerHTML = PHASES.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  s.value = ph || cur.ph;
  document.getElementById('ov-add').classList.add('open');
  document.getElementById('a-t').focus();
}
function closeAdd(){ document.getElementById('ov-add').classList.remove('open'); }
function addIdea(){
  const t = document.getElementById('a-t').value.trim(); if (!t){ document.getElementById('a-t').focus(); return; }
  const ph = document.getElementById('a-ph').value; const u = document.getElementById('a-u').value.trim();
  const it = { id:uid(), platform:document.getElementById('a-pl').value, type:t, desc:document.getElementById('a-d').value.trim(), tag:document.getElementById('a-tag').value.trim(), status:'new', media: u ? [{url:u, note:'', views:''}] : [] };
  items(ph).push(it);
  ['a-t','a-d','a-tag','a-u'].forEach(id => document.getElementById(id).value = '');
  closeAdd(); closed.delete(ph); select(ph, it.id); toast('تمت الإضافة'); saveAll();
}
document.getElementById('ov-add').addEventListener('click', e => { if (e.target.id === 'ov-add') closeAdd(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeAdd(); });

function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2200); }

const PATH = 'soueast_dammam_v3';
let db = null, saveT = null;
function setSync(s){ const el = document.getElementById('sync'); const m = {ok:['● synced','#7bd88f'], dirty:['● unsaved','#FFA726'], saving:['● saving…','#FFA726'], off:['● offline','#ff7b7b'], conn:['● connecting…','#aaa']}[s]; el.textContent = m[0]; el.style.color = m[1]; }
function clean(){ const out = {}; Object.keys(data).forEach(k => out[k] = (data[k]||[]).map(it => ({...it, media:(it.media||[]).map(norm)}))); return out; }
function saveAll(manual){
  if (!db){ if (manual) toast('ما في اتصال بالحفظ'); return; }
  setSync('saving');
  db.ref(PATH).set(clean()).then(() => { setSync('ok'); if (manual) toast('تم الحفظ'); }).catch(() => setSync('off'));
}
function queueSave(){ setSync('dirty'); clearTimeout(saveT); saveT = setTimeout(saveAll, 1500); }
function initFirebase(){
  try {
    firebase.initializeApp(firebaseConfig); db = firebase.database(); setSync('conn');
    db.ref(PATH).once('value').then(snap => {
      const v = snap.val();
      if (v){ PHASES.forEach(p => { data[p.id] = Array.isArray(v[p.id]) ? v[p.id] : (v[p.id] ? Object.values(v[p.id]) : []); }); fixCur(); renderAll(); }
      setSync('ok');
    }).catch(() => setSync('off'));
  } catch(e){ setSync('off'); }
}
function fixCur(){
  const h = location.hash.slice(1).split('-'); const ph = h[0], id = h.slice(1).join('-');
  if (ph && items(ph).some(x => x.id === id)) { cur = {ph, id, ref:0}; return; }
  if (!curItem()){ const f = flat()[0]; cur = f ? {ph:f.ph, id:f.it.id, ref:0} : {ph:'1', id:null, ref:0}; }
}

// ─── INIT ──────────────────────────────────────────────────────────────
fixCur(); renderAll();
if (window.firebase) initFirebase(); else setSync('off');
